name: Deploy

# TODO: remove
#on:
#  # only on tags which follow semantic versioning
#  push:
#    tags:
#      - "v[0-9]+.[0-9]+.[0-9]+"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun run setup

      - name: Build project
        run: bun run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env
        run: |
          echo "REMOTE_USER=${{ secrets.REMOTE_USER }}" >> .env
          echo "REMOTE_HOST=${{ secrets.REMOTE_HOST }}" >> .env
          echo "REMOTE_PATH=~/public_html/wp-content/themes/stair-theme" >> .env

      - name: Run deployment
        run: |
          chmod +x deploy.sh
          ./deploy.sh