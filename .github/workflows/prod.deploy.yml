name: Deploy

on:
  # only on tags which follow semantic versioning
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun run setup

      - name: Build project
        run: bun run build

      - name: Run Lint
        run: bun run lint

  format:
    name: PHP Formatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun run setup

      - name: Build project
        run: bun run build

      - name: Run Formatter
        run: bun run format

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, format]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun run setup

      - name: Build project
        run: bun run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create .env
        run: |
          echo "REMOTE_USER=${{ secrets.REMOTE_USER }}" >> .env
          echo "REMOTE_HOST=${{ secrets.REMOTE_HOST }}" >> .env
          echo "REMOTE_PATH=~/public_html/wp-content/themes/stair-theme-${VERSION}" >> .env

      - name: Run deployment
        run: |
          chmod +x deploy.sh
          ./deploy.sh
